<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Transcription - EchoNotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060510; --bg-2: #0B0918; --card: #0F0D22; --card-hover: #151230;
      --border: rgba(177,151,252,0.16); --border-strong: rgba(198,241,53,0.5);
      --text: #EDEBFF; --muted: #A8A4C9; --violet: #B197FC; --violet-deep: #7C5CF0;
      --lime: #C6F135; --lime-dark: #9BC219; --amber: #FFAB4A; --coral: #FF6F91; --cyan: #4FD1F5;
      --radius: 20px; --maxw: 1240px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition-duration: 0.001s !important; scroll-behavior: auto !important; }
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
    h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
    a { color: var(--violet); text-decoration: none; }
    
    .skip-link { position: absolute; left: -999px; top: 0; background: var(--lime); color: var(--bg); padding: 12px 20px; border-radius: 0 0 10px 0; z-index: 1000; font-weight: 700; }
    .skip-link:focus { left: 0; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; box-shadow: 0 0 0 6px var(--bg); border-radius: 6px; }

    .navbar { position: sticky; top: 0; z-index: 100; background: rgba(6,5,16,0.7); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; max-width: var(--maxw); margin: 0 auto; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; font-family: 'Space Grotesk', sans-serif; color: var(--text); }
    .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14.5px; border-radius: 10px; padding: 11px 20px; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; white-space: nowrap; font-family: inherit; }
    .btn-lime { background: var(--lime); color: var(--bg); }
    .btn-lime:hover { background: var(--lime-dark); transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { background: var(--card-hover); border-color: var(--border-strong); }

    .container { max-width: 900px; margin: 0 auto; padding: 40px 24px; width: 100%; display: flex; flex-direction: column; gap: 32px; flex: 1; }
    
    .top-bar { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; }
    
    .controls-group { display: flex; flex-direction: column; gap: 8px; }
    .controls-group label { font-size: 13.5px; font-weight: 500; color: var(--muted); }
    
    .select-wrapper { position: relative; }
    select { appearance: none; background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 11px 40px 11px 16px; color: var(--text); font-size: 15px; font-family: 'Inter', sans-serif; cursor: pointer; min-width: 180px; }
    select:hover { border-color: var(--border-strong); }
    .select-wrapper::after { content: "▼"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--muted); pointer-events: none; }
    
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; font-size: 12.5px; font-family: 'JetBrains Mono', monospace; color: var(--muted); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }

    .center-controls { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 20px 0; gap: 16px; }
    
    .mic-button { background: transparent; border: none; cursor: pointer; border-radius: 50%; padding: 0; position: relative; display: flex; align-items: center; justify-content: center; width: 100px; height: 100px; }
    .mic-button:focus-visible { border-radius: 50%; }
    
    .mic-visualizer { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; width: 100%; height: 100%; }
    .mic-core { width: 80px; height: 80px; border-radius: 50%; background: var(--card-hover); display: flex; align-items: center; justify-content: center; position: relative; transition: all 0.3s ease; border: 1px solid var(--border); z-index: 2; }
    .mic-core svg path, .mic-core svg rect { stroke: var(--muted); fill: var(--bg-2); transition: all 0.3s ease; }
    
    .mic-rings-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; display: none; z-index: 1; }
    .mic-ring { position: absolute; border: 2px solid var(--lime); border-radius: 50%; opacity: 0; animation: ringPulse 2.4s ease-out infinite; top: 0; left: 0; }
    .mic-ring.r1 { width: 80px; height: 80px; animation-delay: 0s; }
    .mic-ring.r2 { width: 80px; height: 80px; animation-delay: 0.8s; }
    .mic-ring.r3 { width: 80px; height: 80px; animation-delay: 1.6s; }
    @keyframes ringPulse { 0% { width: 80px; height: 80px; opacity: 0.6; transform: translate(0, 0); } 100% { width: 170px; height: 170px; opacity: 0; transform: translate(-45px, -45px); } }
    
    .mic-button[aria-pressed="true"] .mic-core { background: radial-gradient(circle, var(--lime), var(--lime-dark)); border-color: transparent; box-shadow: 0 0 30px rgba(198,241,53,0.4); }
    .mic-button[aria-pressed="true"] .mic-core svg path { stroke: var(--bg); }
    .mic-button[aria-pressed="true"] .mic-core svg rect { fill: var(--bg); stroke: none; }
    .mic-button[aria-pressed="true"] .mic-rings-wrapper { display: block; }
    
    .mic-status { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; height: 20px; }
    .mic-button[aria-pressed="true"] + .mic-status { color: var(--lime); }
    
    .transcript-panel { background: var(--bg-2); border: 1px solid var(--border); border-radius: 14px; padding: 24px; flex: 1; min-height: 400px; display: flex; flex-direction: column; overflow: hidden; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2); }
    .transcript-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .transcript-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    
    .transcript-content { flex: 1; overflow-y: auto; scroll-behavior: smooth; display: flex; flex-direction: column; gap: 12px; padding-right: 10px; }
    .transcript-content::-webkit-scrollbar { width: 8px; }
    .transcript-content::-webkit-scrollbar-track { background: transparent; }
    .transcript-content::-webkit-scrollbar-thumb { background: var(--card-hover); border-radius: 4px; }
    .transcript-content::-webkit-scrollbar-thumb:hover { background: var(--muted); }
    
    .transcript-line { font-family: 'Inter', sans-serif; font-size: 16px; color: var(--text); opacity: 0; animation: fadeIn 0.4s forwards; line-height: 1.6; display: flex; gap: 16px; }
    .transcript-line .time-tag { font-family: 'JetBrains Mono', monospace; color: var(--muted); font-size: 13px; margin-top: 3px; flex-shrink: 0; }
    .transcript-line .text-content { flex: 1; }
    .transcript-line.interim { color: var(--muted); }
    @keyframes fadeIn { to { opacity: 1; } }

    .bottom-actions { display: flex; justify-content: flex-end; padding-top: 24px; border-top: 1px solid var(--border); margin-top: 24px; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="logo" aria-label="EchoNotes home"><span class="logo-dot" aria-hidden="true"></span>EchoNotes</a>
      <a href="dashboard.html" class="btn btn-ghost" style="padding: 8px 16px; font-size: 13px;">Cancel</a>
    </div>
  </header>

  <main id="main-content" class="container">
    
    <div class="top-bar">
      <div class="controls-group">
        <label for="language-select">Lecture Language</label>
        <div class="select-wrapper">
          <select id="language-select" aria-label="Select lecture language">
            <option value="en">English (US)</option>
            <option value="hi">Hindi</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
          </select>
        </div>
      </div>
      
      <div class="badge" aria-label="Current speech-to-text engine status">
        <div class="badge-dot" id="engine-dot"></div>
        <span id="engine-label">Engine: Standby</span>
      </div>
    </div>
    
    <div class="center-controls">
      <button id="mic-toggle" class="mic-button" aria-pressed="false" aria-label="Start recording">
        <div class="mic-visualizer">
          <div class="mic-rings-wrapper">
            <div class="mic-ring r1" aria-hidden="true"></div>
            <div class="mic-ring r2" aria-hidden="true"></div>
            <div class="mic-ring r3" aria-hidden="true"></div>
          </div>
          <div class="mic-core" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="2" width="6" height="12" rx="3"/>
              <path d="M6 11a6 6 0 0 0 12 0" stroke-width="2" stroke-linecap="round"/>
              <path d="M12 19v3M9 22h6" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </button>
      <div class="mic-status" id="mic-status" aria-live="polite">Ready to record</div>
    </div>
    
    <div class="transcript-panel">
      <div class="transcript-header">
        <span class="transcript-title">Live Transcript</span>
      </div>
      <div class="transcript-content" id="transcript-content" aria-live="polite" aria-atomic="false" role="log" aria-label="Live lecture transcript">
        <!-- Transcript lines will appear here -->
      </div>
    </div>
    
    <div class="bottom-actions">
      <button id="finish-btn" class="btn btn-lime" disabled aria-disabled="true">Finish & Generate Notes</button>
    </div>

  </main>

  <script type="module" src="./js/a11y-panel.js"></script>
  <script type="module" src="./js/transcribe.js"></script>
</body>
</html>
