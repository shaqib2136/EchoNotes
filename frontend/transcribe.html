<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Record Lecture — EchoNotes</title>
<meta name="description" content="Record and transcribe your lecture in real time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
<style>
  .transcribe-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 32px;
    max-width: var(--maxw);
    margin: 40px auto;
    padding: 0 24px;
    align-items: start;
    min-height: 70vh;
  }
  .controls-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 24px;
    text-align: center;
    position: sticky;
    top: 100px;
  }
  .mic-container {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto 30px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mic-btn {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: var(--card-hover);
    border: 1px solid var(--border);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    z-index: 10;
    transition: all 0.2s;
  }
  .mic-btn svg { width: 32px; height: 32px; stroke: currentColor; fill: none; }
  .mic-btn[aria-pressed="true"] {
    background: radial-gradient(circle, var(--lime), var(--lime-dark));
    border-color: transparent;
    color: var(--bg);
    box-shadow: 0 0 30px rgba(198,241,53,0.4);
  }
  .mic-ring {
    position: absolute;
    border: 2px solid var(--lime);
    border-radius: 50%;
    opacity: 0;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .mic-btn[aria-pressed="true"] ~ .mic-ring { animation: ringPulse 2.4s ease-out infinite; }
  .mic-btn[aria-pressed="true"] ~ .mic-ring.r1 { animation-delay: 0s; }
  .mic-btn[aria-pressed="true"] ~ .mic-ring.r2 { animation-delay: 0.8s; }
  .mic-btn[aria-pressed="true"] ~ .mic-ring.r3 { animation-delay: 1.6s; }
  
  @keyframes ringPulse {
    0% { width: 80px; height: 80px; opacity: 0.6; }
    100% { width: 180px; height: 180px; opacity: 0; }
  }

  .engine-badge {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 6px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .engine-badge.active { color: var(--lime); border-color: var(--border-strong); }

  .transcript-panel {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    min-height: 500px;
    display: flex;
    flex-direction: column;
  }
  .transcript-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
    margin-bottom: 24px;
  }
  .transcript-header h2 { font-size: 18px; }
  
  .transcript-feed {
    flex: 1;
    overflow-y: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14.5px;
    color: var(--text);
    line-height: 1.8;
  }
  .t-line {
    margin-bottom: 12px;
    display: flex;
    gap: 16px;
    opacity: 0;
    animation: fadeUp 0.3s forwards;
  }
  .t-time {
    color: var(--muted);
    font-size: 12.5px;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .t-text { flex: 1; }
  
  /* Loading Overlay */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 5, 16, 0.9);
    backdrop-filter: blur(10px);
    z-index: 2000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .loading-overlay.active { display: flex; }
  .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--lime);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media(max-width:900px){
    .transcribe-layout { grid-template-columns: 1fr; }
    .controls-panel { position: static; }
  }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="navbar">
  <div class="nav-inner">
    <a href="dashboard.html" class="logo" aria-label="EchoNotes Dashboard"><span class="logo-dot" aria-hidden="true"></span>EchoNotes</a>
    <div class="nav-actions">
      <a href="dashboard.html" class="btn btn-ghost">Cancel</a>
    </div>
  </div>
</header>

<main id="main-content" class="transcribe-layout">
  <aside class="controls-panel">
    <div class="mic-container">
      <button id="mic-btn" class="mic-btn" aria-pressed="false" aria-label="Start recording">
        <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0" stroke-width="2" stroke-linecap="round"/><path d="M12 19v3M9 22h6" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="mic-ring r1" aria-hidden="true"></div>
      <div class="mic-ring r2" aria-hidden="true"></div>
      <div class="mic-ring r3" aria-hidden="true"></div>
    </div>
    
    <div id="engine-badge" class="engine-badge">Engine: Offline</div>
    
    <div id="alert-message" class="alert" aria-live="polite" role="status"></div>
    
    <button id="finish-btn" class="btn btn-lime btn-lg" style="width: 100%;" disabled>Finish & Generate Notes</button>
    <p style="font-size: 13px; color: var(--muted); margin-top: 16px;">Press <kbd>Space</kbd> to toggle mic</p>
  </aside>

  <section class="transcript-panel">
    <div class="transcript-header">
      <h2>Live Transcript</h2>
    </div>
    <div id="transcript-feed" class="transcript-feed" aria-live="polite" aria-atomic="false">
      <!-- Transcript lines will appear here -->
      <div style="color: var(--muted); font-family: 'Inter', sans-serif;">Click the microphone to begin listening...</div>
    </div>
  </section>
</main>

<div id="loading-overlay" class="loading-overlay" aria-hidden="true">
  <div class="spinner"></div>
  <h2 style="color: var(--text); font-family: 'Space Grotesk', sans-serif;">Organizing Notes...</h2>
  <p style="color: var(--muted); font-size: 15px; margin-top: 8px;">EchoNotes is structuring your lecture.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabaseClient.js"></script>
<script src="./js/transcribe.js"></script>
</body>
</html>
