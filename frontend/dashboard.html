<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — EchoNotes</title>
  <meta name="description" content="View and manage your saved lecture notes.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/styles.css">

  <style>
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 60px 0 24px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 40px;
    }

    .dashboard-header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .dashboard-header p {
      color: var(--muted);
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      margin-bottom: 80px;
    }

    .note-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      min-height: 240px;
    }

    .note-card:hover {
      border-color: var(--border-strong);
      background: var(--card-hover);
      transform: translateY(-3px);
    }

    .note-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      color: var(--lime);
      margin-bottom: 12px;
    }

    .note-title {
      font-size: 20px;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    /* Cleaner version without vendor-specific properties */
    .note-snippet {
      color: var(--muted);
      font-size: 14.5px;
      margin-bottom: 24px;
      flex-grow: 1;
      line-height: 1.5;
      max-height: calc(1.5em * 3);
      overflow: hidden;
    }

    .note-actions {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      background: var(--bg-2);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    .empty-state h3 {
      margin-bottom: 12px;
      font-size: 24px;
    }

    .empty-state p {
      color: var(--muted);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo" aria-label="EchoNotes home">
        <span class="logo-dot" aria-hidden="true"></span>EchoNotes
      </a>
      <div class="nav-actions">
        <button id="logout-btn" class="btn btn-ghost">Log out</button>
        <a href="transcribe.html" class="btn btn-lime">Record Lecture</a>
      </div>
    </div>
  </header>

  <main id="main-content" class="container">
    <div class="dashboard-header">
      <div>
        <h1 id="greeting">Your Notes</h1>
        <p>All your structured lectures in one place.</p>
      </div>
      <a href="transcribe.html" class="btn btn-lime">Record New</a>
    </div>

    <div id="alert-message" class="alert" aria-live="polite" role="status"></div>

    <div id="notes-grid" class="notes-grid" aria-live="polite">
      <!-- Notes will be injected here via JavaScript -->
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabaseClient.js"></script>
  <script src="./js/dashboard.js"></script>
</body>
</html>
