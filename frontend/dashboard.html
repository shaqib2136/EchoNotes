<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - EchoNotes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #060510; --bg-2: #0B0918; --card: #0F0D22; --card-hover: #151230;
      --border: rgba(177,151,252,0.16); --border-strong: rgba(198,241,53,0.5);
      --text: #EDEBFF; --muted: #A8A4C9; --violet: #B197FC; --violet-deep: #7C5CF0;
      --lime: #C6F135; --lime-dark: #9BC219; --amber: #FFAB4A; --coral: #FF6F91; --cyan: #4FD1F5;
      --radius: 20px; --maxw: 1240px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition-duration: 0.001s !important; scroll-behavior: auto !important; }
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
    h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
    a { color: var(--violet); text-decoration: none; }
    
    .skip-link { position: absolute; left: -999px; top: 0; background: var(--lime); color: var(--bg); padding: 12px 20px; border-radius: 0 0 10px 0; z-index: 1000; font-weight: 700; }
    .skip-link:focus { left: 0; }
    a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--lime); outline-offset: 3px; box-shadow: 0 0 0 6px var(--bg); border-radius: 6px; }

    .navbar { position: sticky; top: 0; z-index: 100; background: rgba(6,5,16,0.7); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; max-width: var(--maxw); margin: 0 auto; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; font-family: 'Space Grotesk', sans-serif; color: var(--text); }
    .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 12px var(--lime); }
    
    .nav-actions { display: flex; align-items: center; gap: 14px; }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14.5px; border-radius: 10px; padding: 11px 20px; border: 1px solid transparent; cursor: pointer; transition: all 0.2s; white-space: nowrap; font-family: inherit; }
    .btn-lime { background: var(--lime); color: var(--bg); }
    .btn-lime:hover { background: var(--lime-dark); transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
    .btn-ghost:hover { background: var(--card-hover); border-color: var(--border-strong); }

    .container { max-width: var(--maxw); margin: 0 auto; padding: 40px 24px; width: 100%; display: flex; flex-direction: column; gap: 32px; flex: 1; }
    
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; margin-bottom: 24px; }
    .dashboard-header h1 { font-size: clamp(28px, 4vw, 36px); }
    
    .search-bar { position: relative; width: 100%; max-width: 400px; }
    .search-input { width: 100%; background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px 12px 44px; color: var(--text); font-size: 15px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--lime); outline: none; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
    
    .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    
    .note-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; display: flex; flex-direction: column; transition: all 0.25s; position: relative; overflow: hidden; }
    .note-card:hover { border-color: var(--border-strong); background: var(--card-hover); transform: translateY(-3px); }
    .note-card:hover::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at top right, rgba(198,241,53,0.05), transparent 60%); pointer-events: none; }
    
    .note-date { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--lime); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .note-title { font-size: 20px; margin-bottom: 10px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
    .note-summary { color: var(--muted); font-size: 14.5px; margin-bottom: 24px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    
    .note-actions { display: flex; gap: 12px; margin-top: auto; border-top: 1px solid var(--border); padding-top: 16px; }
    .note-actions .btn { flex: 1; padding: 8px 0; font-size: 13.5px; }

    .empty-state { text-align: center; padding: 80px 24px; background: var(--bg-2); border: 1px dashed var(--border); border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; grid-column: 1 / -1; }
    .empty-icon { width: 64px; height: 64px; border-radius: 16px; background: rgba(177,151,252,0.1); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; color: var(--violet); }
    .empty-state h3 { font-size: 22px; margin-bottom: 12px; }
    .empty-state p { color: var(--muted); max-width: 400px; margin: 0 auto 24px; }
    
    .loader { display: none; width: 40px; height: 40px; border: 3px solid rgba(198,241,53,0.2); border-radius: 50%; border-top-color: var(--lime); animation: spin 1s ease-in-out infinite; margin: 60px auto; grid-column: 1 / -1; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="navbar">
    <div class="nav-inner">
      <a href="../index.html" class="logo" aria-label="EchoNotes home"><span class="logo-dot" aria-hidden="true"></span>EchoNotes</a>
      <div class="nav-actions">
        <a href="transcribe.html" class="btn btn-lime">New Lecture</a>
        <button id="logout-btn" class="btn btn-ghost" aria-label="Log out">Log out</button>
      </div>
    </div>
  </header>

  <main id="main-content" class="container">
    <div class="dashboard-header">
      <h1>My Notes</h1>
      
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 21L15.0001 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search transcripts and summaries..." aria-label="Search notes">
      </div>
    </div>
    
    <div id="loader" class="loader" aria-label="Loading notes" role="status"></div>
    
    <div class="notes-grid" id="notes-grid" aria-live="polite">
      <!-- Note cards will be populated here -->
    </div>
  </main>

  <script type="module" src="./js/a11y-panel.js"></script>
  <script type="module" src="./js/dashboard.js"></script>
</body>
</html>
