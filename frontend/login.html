<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — EchoNotes</title>
<meta name="description" content="Log in or sign up to EchoNotes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
<style>
  .auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    position: relative;
    overflow: hidden;
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 10;
    text-align: center;
  }
  .auth-header {
    margin-bottom: 32px;
  }
  .auth-header h1 {
    font-size: 32px;
    margin-bottom: 8px;
  }
  .auth-header p {
    color: var(--muted);
  }
  .toggle-group {
    display: flex;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    margin-bottom: 32px;
  }
  .toggle-btn {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 10px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .toggle-btn[aria-pressed="true"] {
    background: var(--card-hover);
    color: var(--text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .auth-form {
    display: none;
  }
  .auth-form.active {
    display: block;
  }
  /* Mesh backgrounds for visual consistency */
  .mesh-blob { position: absolute; border-radius: 50%; filter: blur(70px); mix-blend-mode: screen; z-index: 0; }
  .mesh-1 { width: 400px; height: 400px; background: var(--violet-deep); opacity: 0.4; top: -100px; left: -100px; }
  .mesh-2 { width: 300px; height: 300px; background: var(--lime); opacity: 0.2; bottom: -50px; right: -50px; }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="navbar">
  <div class="nav-inner">
    <a href="index.html" class="logo" aria-label="EchoNotes home"><span class="logo-dot" aria-hidden="true"></span>EchoNotes</a>
  </div>
</header>

<main id="main-content" class="auth-container">
  <div class="mesh-blob mesh-1" aria-hidden="true"></div>
  <div class="mesh-blob mesh-2" aria-hidden="true"></div>

  <div class="auth-card card-style">
    <div class="auth-header">
      <h1 id="auth-title">Welcome back</h1>
      <p id="auth-desc">Enter your details to access your notes.</p>
    </div>

    <div class="toggle-group" role="group" aria-label="Authentication mode">
      <button type="button" class="toggle-btn" aria-pressed="true" id="btn-login" onclick="switchTab('login')">Log In</button>
      <button type="button" class="toggle-btn" aria-pressed="false" id="btn-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="alert-message" class="alert" aria-live="polite" role="status"></div>

    <!-- Login Form -->
    <form id="form-login" class="auth-form active">
      <div class="form-group">
        <label for="login-email">Email address</label>
        <input type="email" id="login-email" class="form-input" placeholder="you@university.edu" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="form-input" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-lime" style="width: 100%; margin-top: 10px;">Log In</button>
    </form>

    <!-- Signup Form -->
    <form id="form-signup" class="auth-form">
      <div class="form-group">
        <label for="signup-email">Student Email address</label>
        <input type="email" id="signup-email" class="form-input" placeholder="you@university.edu" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="signup-password">Create Password</label>
        <input type="password" id="signup-password" class="form-input" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-lime" style="width: 100%; margin-top: 10px;">Create Account</button>
    </form>
  </div>
</main>

<script>
  function switchTab(tab) {
    const isLogin = tab === 'login';
    
    // Update Buttons
    document.getElementById('btn-login').setAttribute('aria-pressed', isLogin);
    document.getElementById('btn-signup').setAttribute('aria-pressed', !isLogin);
    
    // Update Forms
    document.getElementById('form-login').classList.toggle('active', isLogin);
    document.getElementById('form-signup').classList.toggle('active', !isLogin);
    
    // Update Text
    document.getElementById('auth-title').textContent = isLogin ? 'Welcome back' : 'Create an account';
    document.getElementById('auth-desc').textContent = isLogin ? 'Enter your details to access your notes.' : 'Free forever for verified students.';
    
    // Clear alerts
    document.getElementById('alert-message').className = 'alert';
    document.getElementById('alert-message').textContent = '';
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabaseClient.js"></script>
<script src="./js/auth.js"></script>
</body>
</html>
